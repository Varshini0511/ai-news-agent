# Add/remove feeds freely. Any RSS/Atom URL works.
interests: >
  New model releases, agent frameworks and tooling (MCP, Claude Code, LangGraph, etc.),
  practical agent-building tutorials, major AI company announcements, open-source AI projects,
  AI research that is directly useful to builders. Also: newly released developer tools (AI coding tools like T3 Code, Cursor, Claude Code, Codex, Gemini CLI),
  and anything offering free credits, free tiers, promos or grants for AI APIs/tools (rate these 8+).
  Ignore hype, funding gossip and opinion fluff.

feeds:
  - {name: Anthropic News,   url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml"}  # community-generated; Anthropic has no official RSS
  - {name: Anthropic Eng,    url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_engineering.xml"}
  - {name: OpenAI Blog,      url: "https://openai.com/news/rss.xml"}
  - {name: Google AI Blog,   url: "https://blog.google/technology/ai/rss/"}
  - {name: Hugging Face,     url: "https://huggingface.co/blog/feed.xml"}
  - {name: Simon Willison,   url: "https://simonwillison.net/atom/everything/"}
  - {name: Latent Space,     url: "https://www.latent.space/feed"}
  - {name: Hacker News,      url: "https://news.ycombinator.com/rss"}
  - {name: arXiv cs.AI,      url: "https://rss.arxiv.org/rss/cs.AI"}
  - {name: Reddit LocalLLaMA, url: "https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day"}

  # Labs / models
  - {name: Google DeepMind,  url: "https://deepmind.google/blog/rss.xml"}
  - {name: Mistral,          url: "https://mistral.ai/rss.xml"}

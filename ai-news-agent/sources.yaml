  - {name: T3 Code releases,      url: "https://github.com/pingdotgg/t3code/releases.atom"}
  - {name: Cursor changelog,      url: "https://cursor.com/changelog/rss.xml"}
  - {name: Theo (t3.gg) YouTube,  url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCbRP3c757lWg9M-U7TyEkXA"}
  # Newsletters / launches (cover xAI, Perplexity, Meta etc. which have no RSS)
